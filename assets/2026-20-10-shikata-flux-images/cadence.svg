<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="Verdana, Geneva, sans-serif">
  <rect x="0" y="0" width="920" height="330" fill="#ffffff"/>

  <text x="20" y="30" font-size="14.5" font-weight="bold" fill="#222">Three different clocks, on purpose</text>

  <!-- Row 1: apps 10m -->
  <text x="20" y="80" font-size="13" font-weight="bold" fill="#1b4d20">App stack — digest check</text>
  <text x="20" y="99" font-size="12" fill="#1b4d20">every 10 min</text>
  <rect x="230" y="58" width="660" height="30" rx="6" fill="#e9f7ee" stroke="#2e7d32" stroke-width="1.6"/>
  <g stroke="#2e7d32" stroke-width="2">
    <line x1="258" y1="58" x2="258" y2="88"/><line x1="286" y1="58" x2="286" y2="88"/>
    <line x1="314" y1="58" x2="314" y2="88"/><line x1="342" y1="58" x2="342" y2="88"/>
    <line x1="370" y1="58" x2="370" y2="88"/><line x1="398" y1="58" x2="398" y2="88"/>
    <line x1="426" y1="58" x2="426" y2="88"/><line x1="454" y1="58" x2="454" y2="88"/>
    <line x1="482" y1="58" x2="482" y2="88"/><line x1="510" y1="58" x2="510" y2="88"/>
    <line x1="538" y1="58" x2="538" y2="88"/><line x1="566" y1="58" x2="566" y2="88"/>
    <line x1="594" y1="58" x2="594" y2="88"/><line x1="622" y1="58" x2="622" y2="88"/>
    <line x1="650" y1="58" x2="650" y2="88"/><line x1="678" y1="58" x2="678" y2="88"/>
    <line x1="706" y1="58" x2="706" y2="88"/><line x1="734" y1="58" x2="734" y2="88"/>
    <line x1="762" y1="58" x2="762" y2="88"/><line x1="790" y1="58" x2="790" y2="88"/>
    <line x1="818" y1="58" x2="818" y2="88"/><line x1="846" y1="58" x2="846" y2="88"/>
    <line x1="874" y1="58" x2="874" y2="88"/>
  </g>
  <text x="895" y="78" text-anchor="end" font-size="11.5" fill="#1b4d20"></text>

  <!-- Row 2: automation 30m -->
  <text x="20" y="150" font-size="13" font-weight="bold" fill="#6e4a08">Automation — commit cycle</text>
  <text x="20" y="169" font-size="12" fill="#6e4a08">every 30 min</text>
  <rect x="230" y="128" width="660" height="30" rx="6" fill="#fdf3e3" stroke="#b97e1e" stroke-width="1.6"/>
  <g stroke="#b97e1e" stroke-width="2.4">
    <line x1="314" y1="128" x2="314" y2="158"/><line x1="398" y1="128" x2="398" y2="158"/>
    <line x1="482" y1="128" x2="482" y2="158"/><line x1="566" y1="128" x2="566" y2="158"/>
    <line x1="650" y1="128" x2="650" y2="158"/><line x1="734" y1="128" x2="734" y2="158"/>
    <line x1="818" y1="128" x2="818" y2="158"/>
  </g>

  <!-- Row 3: games 168h -->
  <text x="20" y="220" font-size="13" font-weight="bold" fill="#341d63">Game servers — registry scan</text>
  <text x="20" y="239" font-size="12" fill="#341d63">every 168 h (weekly)</text>
  <rect x="230" y="198" width="660" height="30" rx="6" fill="#f1eafd" stroke="#5e35b1" stroke-width="1.6"/>
  <line x1="560" y1="198" x2="560" y2="228" stroke="#5e35b1" stroke-width="2.4"/>
  <text x="560" y="252" text-anchor="middle" font-size="12" fill="#341d63">one window a week — an update can never land mid-session two nights in a row</text>

  <!-- axis note -->
  <text x="230" y="290" font-size="11.5" fill="#666">Bars not to a common scale — that's the point. The cadence is a per-image decision, not a cluster-wide one.</text>

  <text x="20" y="318" font-size="11.5" fill="#666">Same mechanism, three tempers: eager for apps, batched for commits, lazy for games.</text>
</svg>
