<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="860" height="470" rx="12" fill="#1a1f2e"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#dfe6f3">How the agent works on the homelab</text>

  <!-- row 1: control path -->
  <rect x="20" y="90" width="150" height="64" rx="8" fill="#232b3d" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="95" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">Phone</text>
  <text x="95" y="134" text-anchor="middle" font-size="12.5" fill="#9aa7c2">Seoul</text>

  <rect x="190" y="90" width="140" height="64" rx="8" fill="#232b3d" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="260" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">Muse chat</text>
  <text x="260" y="134" text-anchor="middle" font-size="12.5" fill="#9aa7c2">plain messages</text>

  <rect x="350" y="90" width="150" height="64" rx="8" fill="#232b3d" stroke="#9ece6a" stroke-width="2"/>
  <text x="425" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#9ece6a">Agent VM</text>
  <text x="425" y="134" text-anchor="middle" font-size="12.5" fill="#9aa7c2">Jett</text>

  <rect x="520" y="90" width="150" height="64" rx="8" fill="#232b3d" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="595" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">Tailscale SSH</text>
  <text x="595" y="134" text-anchor="middle" font-size="12.5" fill="#9aa7c2">tunnel :3130</text>

  <rect x="690" y="90" width="150" height="64" rx="8" fill="#232b3d" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="765" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">azamilab0</text>
  <text x="765" y="134" text-anchor="middle" font-size="12.5" fill="#9aa7c2">k3s · systemd · files</text>

  <line x1="170" y1="122" x2="188" y2="122" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="188,122 180,116 180,128" fill="#5a6a8a"/>
  <line x1="330" y1="122" x2="348" y2="122" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="348,122 340,116 340,128" fill="#5a6a8a"/>
  <line x1="500" y1="122" x2="518" y2="122" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="518,122 510,116 510,128" fill="#5a6a8a"/>
  <line x1="670" y1="122" x2="688" y2="122" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="688,122 680,116 680,128" fill="#5a6a8a"/>

  <!-- vertical into change path -->
  <line x1="425" y1="154" x2="400" y2="228" stroke="#9ece6a" stroke-width="1.5"/>
  <polygon points="400,228 394,218 406,218" fill="#9ece6a"/>

  <!-- row 2: change path -->
  <rect x="300" y="228" width="200" height="64" rx="8" fill="#232b3d" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="400" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">branch → commit → push</text>
  <text x="400" y="272" text-anchor="middle" font-size="12.5" fill="#9aa7c2">commits GPG-signed</text>

  <rect x="520" y="228" width="110" height="64" rx="8" fill="#232b3d" stroke="#e0af68" stroke-width="1.5"/>
  <text x="575" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#e0af68">GitHub</text>
  <text x="575" y="272" text-anchor="middle" font-size="12.5" fill="#9aa7c2">pull request</text>

  <rect x="650" y="228" width="190" height="64" rx="8" fill="#232b3d" stroke="#e0af68" stroke-width="1.5"/>
  <text x="745" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#dfe6f3">Patrick merges</text>
  <text x="745" y="272" text-anchor="middle" font-size="12.5" fill="#9aa7c2">from his phone · main untouched</text>

  <line x1="500" y1="260" x2="518" y2="260" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="518,260 510,254 510,266" fill="#5a6a8a"/>
  <line x1="630" y1="260" x2="648" y2="260" stroke="#5a6a8a" stroke-width="1.5"/>
  <polygon points="648,260 640,254 640,266" fill="#5a6a8a"/>

  <!-- notes -->
  <rect x="40" y="322" width="380" height="76" rx="8" fill="#232b3d" stroke="#6b7694" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="230" y="348" text-anchor="middle" font-size="13.5" font-weight="600" fill="#dfe6f3">Approval cards gate irreversible actions</text>
  <text x="230" y="370" text-anchor="middle" font-size="12.5" fill="#9aa7c2">sends, merges, destructive commands</text>

  <rect x="440" y="322" width="380" height="76" rx="8" fill="#232b3d" stroke="#6b7694" stroke-width="1" stroke-dasharray="6,5"/>
  <text x="630" y="348" text-anchor="middle" font-size="13.5" font-weight="600" fill="#dfe6f3">Secrets via Secure Vault or on-box</text>
  <text x="630" y="370" text-anchor="middle" font-size="12.5" fill="#9aa7c2">never in chat — keys are files, not pastes</text>

  <text x="430" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7694">Diagram generated with AI assistance.</text>
</svg>
