<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Verdana, Geneva, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>

  <!-- Node / source -->
  <rect x="20" y="130" width="220" height="170" rx="10" fill="#eef4fb" stroke="#33679e" stroke-width="2"/>
  <text x="130" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3f5e">k3s node</text>
  <text x="130" y="182" text-anchor="middle" font-size="12.5" fill="#1d3f5e">app workloads</text>
  <text x="130" y="202" text-anchor="middle" font-size="12.5" fill="#1d3f5e">(Immich, Readarr, Rybbit, …)</text>
  <rect x="45" y="220" width="170" height="56" rx="6" fill="#ffffff" stroke="#33679e"/>
  <text x="130" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3f5e">/pvdata</text>
  <text x="130" y="263" text-anchor="middle" font-size="12" fill="#1d3f5e">local-path volumes · ~6 GB</text>

  <!-- Backrest -->
  <rect x="340" y="150" width="200" height="130" rx="10" fill="#fdf3e3" stroke="#b97e1e" stroke-width="2"/>
  <text x="440" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e4a08">Backrest pod</text>
  <text x="440" y="204" text-anchor="middle" font-size="12.5" fill="#6e4a08">restic under the hood,</text>
  <text x="440" y="224" text-anchor="middle" font-size="12.5" fill="#6e4a08"> web UI on top</text>
  <text x="440" y="252" text-anchor="middle" font-size="12" fill="#6e4a08">reads /pvdata in place</text>

  <!-- arrow node -> backrest -->
  <line x1="240" y1="215" x2="332" y2="215" stroke="#444" stroke-width="2"/>
  <polygon points="332,215 322,209 322,221" fill="#444"/>

  <!-- B2 -->
  <rect x="640" y="40" width="260" height="120" rx="10" fill="#e9f7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b4d20">Backblaze B2</text>
  <text x="770" y="92" text-anchor="middle" font-size="12.5" fill="#1b4d20">plan: pvc-nightly · 03:00 Toronto</text>
  <text x="770" y="112" text-anchor="middle" font-size="12.5" fill="#1b4d20">FULL /pvdata backup (~6 GB)</text>
  <text x="770" y="132" text-anchor="middle" font-size="12.5" fill="#1b4d20">retention 7 daily / 4 weekly / 3 monthly</text>
  <text x="770" y="150" text-anchor="middle" font-size="11.5" fill="#1b4d20">lifecycle: keep last version only!</text>

  <!-- MySQL -->
  <rect x="640" y="220" width="260" height="120" rx="10" fill="#fdeeee" stroke="#c62828" stroke-width="2"/>
  <text x="770" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d1212">MySQL (OCI Always Free)</text>
  <text x="770" y="272" text-anchor="middle" font-size="12.5" fill="#6d1212">mounted as a filesystem (mysqlfs)</text>
  <text x="770" y="292" text-anchor="middle" font-size="12.5" fill="#6d1212">plan: db-critical · hourly</text>
  <text x="770" y="312" text-anchor="middle" font-size="12.5" fill="#6d1212">critical DBs only · ~580 MB</text>
  <text x="770" y="330" text-anchor="middle" font-size="11.5" fill="#6d1212">small writes only — binlogs!</text>

  <!-- arrows backrest -> targets -->
  <path d="M 540 185 C 590 160, 590 110, 632 100" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="640,98 629,95 633,107" fill="#2e7d32"/>
  <path d="M 540 245 C 590 260, 590 275, 632 278" fill="none" stroke="#c62828" stroke-width="2"/>
  <polygon points="640,278 629,272 630,285" fill="#c62828"/>

  <!-- Alerts -->
  <rect x="285" y="360" width="470" height="76" rx="10" fill="#f1eafd" stroke="#5e35b1" stroke-width="2"/>
  <text x="520" y="388" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#341d63">On any failure → Gotify + Discord</text>
  <text x="520" y="412" text-anchor="middle" font-size="12.5" fill="#341d63">Gotify lives on a separate VM — it still works if the cluster is down</text>

  <!-- dashed alert links -->
  <path d="M 770 160 L 770 398 L 763 398" fill="none" stroke="#5e35b1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="755,398 765,393 765,403" fill="#5e35b1"/>
  <path d="M 440 280 L 440 352" fill="none" stroke="#5e35b1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="440,360 435,350 445,350" fill="#5e35b1"/>

  <text x="20" y="452" font-size="11.5" fill="#666">Total monthly cost: $0. All of it free tiers and spare parts.</text>
</svg>
