<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="860" height="430" rx="12" fill="#1a1f2e"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#dfe6f3">Where the savings came from</text>

  <!-- header -->
  <text x="60" y="72" font-size="12" font-weight="600" fill="#6b7694">WHAT</text>
  <text x="330" y="72" font-size="12" font-weight="600" fill="#6b7694">BEFORE</text>
  <text x="600" y="72" font-size="12" font-weight="600" fill="#6b7694">AFTER</text>

  <!-- row 1 -->
  <rect x="30" y="84" width="800" height="52" rx="8" fill="#232b3d"/>
  <text x="60" y="115" font-size="14" font-weight="600" fill="#dfe6f3">Datadog system-probe</text>
  <text x="330" y="115" font-size="14" fill="#f7768e">~26% CPU, eBPF poll loop</text>
  <text x="560" y="115" font-size="16" fill="#6b7694">→</text>
  <text x="600" y="115" font-size="14" fill="#9ece6a">modules trimmed</text>

  <!-- row 2 -->
  <rect x="30" y="144" width="800" height="52" rx="8" fill="#1e2433"/>
  <text x="60" y="175" font-size="14" font-weight="600" fill="#dfe6f3">Datadog cluster agent</text>
  <text x="330" y="175" font-size="14" fill="#f7768e">~11m CPU / ~140Mi RAM</text>
  <text x="560" y="175" font-size="16" fill="#6b7694">→</text>
  <text x="600" y="175" font-size="14" fill="#9ece6a">removed (one node)</text>

  <!-- row 3 -->
  <rect x="30" y="204" width="800" height="52" rx="8" fill="#232b3d"/>
  <text x="60" y="235" font-size="14" font-weight="600" fill="#dfe6f3">/var/log</text>
  <text x="330" y="235" font-size="14" fill="#f7768e">4.9 GB</text>
  <text x="560" y="235" font-size="16" fill="#6b7694">→</text>
  <text x="600" y="235" font-size="14" fill="#9ece6a">2.2 GB</text>

  <!-- row 4 -->
  <rect x="30" y="264" width="800" height="52" rx="8" fill="#1e2433"/>
  <text x="60" y="295" font-size="14" font-weight="600" fill="#dfe6f3">snapd, docker.io, aide, postfix…</text>
  <text x="330" y="295" font-size="14" fill="#f7768e">installed, idle</text>
  <text x="560" y="295" font-size="16" fill="#6b7694">→</text>
  <text x="600" y="295" font-size="14" fill="#9ece6a">purged / disabled</text>

  <!-- row 5 -->
  <rect x="30" y="324" width="800" height="52" rx="8" fill="#232b3d"/>
  <text x="60" y="355" font-size="14" font-weight="600" fill="#dfe6f3">shikatalab0 (1 GB RAM)</text>
  <text x="330" y="355" font-size="14" fill="#f7768e">no swap, uncapped journal</text>
  <text x="560" y="355" font-size="16" fill="#6b7694">→</text>
  <text x="600" y="355" font-size="14" fill="#9ece6a">2 GB swap, journal 50M cap</text>

  <text x="430" y="408" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7694">Diagram generated with AI assistance.</text>
</svg>
